<div class="login">
  <!-- Bay Ganyo, from Aleko Konstantinov's stories (1895), in our own drawing. Decoration only,
       so screen readers skip it. -->
  <svg class="buddy" viewBox="0 0 200 200" aria-hidden="true">
    <!-- ears, face -->
    <ellipse cx="37" cy="122" rx="10" ry="14" fill="#dfa47c"/>
    <ellipse cx="163" cy="122" rx="10" ry="14" fill="#dfa47c"/>
    <ellipse class="head" cx="100" cy="118" rx="64" ry="62" fill="#e9b48c"/>
    <ellipse cx="60" cy="134" rx="11" ry="6" fill="#d4573f" opacity=".28"/>
    <ellipse cx="140" cy="134" rx="11" ry="6" fill="#d4573f" opacity=".28"/>

    <!-- black lambskin kalpak with a rose tucked in it -->
    <path d="M44 74C44 42 58 12 100 10c42 2 56 32 56 64z" fill="#2a2421"/>
    <ellipse cx="100" cy="73" rx="57" ry="10" fill="#352d28"/>
    <g fill="none" stroke="#3f3631" stroke-width="2.5" stroke-linecap="round">
      <path d="M62 32q5-4 10 0M84 22q5-4 10 0M108 22q5-4 10 0M128 32q5-4 10 0M70 50q5-4 10 0M94 42q5-4 10 0M118 50q5-4 10 0M58 62q5-4 10 0M132 62q5-4 10 0"/>
    </g>
    <g class="rose">
      <ellipse cx="146" cy="50" rx="9" ry="4" fill="#93b86e" transform="rotate(-30 146 50)"/>
      <circle cx="140" cy="44" r="9" fill="#d4573f"/>
      <path d="M140 40a4 4 0 1 1-3 5m5-1a2 2 0 1 0-2-2" fill="none" stroke="#9e3a28" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- eyebrows, eyes, nose -->
    <path d="M60 88q16-10 32-2M108 86q16-8 32 2" fill="none" stroke="#2a2421" stroke-width="6" stroke-linecap="round"/>
    <g class="eyes">
      <g class="eye"><ellipse cx="76" cy="104" rx="12" ry="14" fill="#fff8ec"/><circle class="pupil" cx="76" cy="107" r="6" fill="#1b1916"/></g>
      <g class="eye"><ellipse cx="124" cy="104" rx="12" ry="14" fill="#fff8ec"/><circle class="pupil" cx="124" cy="107" r="6" fill="#1b1916"/></g>
    </g>
    <ellipse cx="100" cy="124" rx="11" ry="9" fill="#d9946b"/>

    <!-- mouth under a big handlebar moustache -->
    <path class="mouth mouth-smile" d="M88 143q12 9 24 0" fill="none" stroke="#7a3a2a" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse class="mouth mouth-o" cx="100" cy="147" rx="5" ry="6" fill="#7a3a2a"/>
    <path class="mst mst-left" d="M100 138C90 135 80 137 70 142C60 147 50 145 46 135C44 129 47 122 53 120C49 127 53 134 61 133C69 132 75 123 87 122C95 121 99 125 100 128Z" fill="#1d1d1b"/>
    <path class="mst mst-right" d="M100 138C110 135 120 137 130 142C140 147 150 145 154 135C156 129 153 122 147 120C151 127 147 134 139 133C131 132 125 123 113 122C105 121 101 125 100 128Z" fill="#1d1d1b"/>

    <!-- hands -->
    <g class="hand hand-left">
      <rect class="finger f1" x="56.5" y="90" width="13" height="46" rx="6.5" fill="#dfa47c" stroke="#c68560" stroke-width="1.5"/>
      <rect class="finger f2" x="69.5" y="86" width="13" height="50" rx="6.5" fill="#dfa47c" stroke="#c68560" stroke-width="1.5"/>
      <rect class="finger f3" x="82.5" y="90" width="13" height="46" rx="6.5" fill="#dfa47c" stroke="#c68560" stroke-width="1.5"/>
      <ellipse cx="76" cy="140" rx="27" ry="18" fill="#dfa47c"/>
    </g>
    <g class="hand hand-right">
      <rect class="finger f1" x="104.5" y="90" width="13" height="46" rx="6.5" fill="#dfa47c" stroke="#c68560" stroke-width="1.5"/>
      <rect class="finger f2" x="117.5" y="86" width="13" height="50" rx="6.5" fill="#dfa47c" stroke="#c68560" stroke-width="1.5"/>
      <rect class="finger f3" x="130.5" y="90" width="13" height="46" rx="6.5" fill="#dfa47c" stroke="#c68560" stroke-width="1.5"/>
      <ellipse cx="124" cy="140" rx="27" ry="18" fill="#dfa47c"/>
    </g>
  </svg>

  <form class="login-form" novalidate>
    <label class="field">
      <span>Email</span>
      <input class="input" id="email" type="email" autocomplete="off" placeholder="you@example.com">
    </label>
    <label class="field" for="password">
      <span>Password</span>
    </label>
    <div class="password">
      <input class="input" id="password" type="password" autocomplete="off">
      <button type="button" class="show" id="show" aria-pressed="false" aria-controls="password">Show</button>
    </div>
    <button type="submit" class="submit">Log in</button>
    <p class="note" id="note" role="status"></p>
  </form>
</div>
