<div class="tl-grid">
  <div class="card">
    <p class="tl-card-title" data-en="Amount">Beløb</p>
    <div class="tl-fields">
      <label class="tl-field">
        <span data-en="Type an amount">Skriv et beløb</span>
        <span class="tl-affix" data-suffix="kr."><input id="mb-amount" class="tl-input tl-input-big" inputmode="decimal" autocomplete="off" placeholder="1.000,00" data-en-placeholder="1,000.00" value="1000"></span>
      </label>
      <div class="tl-field">
        <span class="tl-label" id="mb-mode-label" data-en="The amount is">Beløbet er</span>
        <div class="tl-seg" role="group" aria-labelledby="mb-mode-label">
          <button type="button" data-mode="ex" aria-pressed="true" data-en="Without VAT (add VAT)">Uden moms (læg moms til)</button>
          <button type="button" data-mode="inc" aria-pressed="false" data-en="With VAT (take VAT out)">Med moms (træk moms ud)</button>
        </div>
      </div>
    </div>

    <p class="tl-card-title" data-en="Several amounts at once">Flere beløb på én gang</p>
    <label class="tl-field">
      <span><span data-en="One amount per line">Ét beløb pr. linje</span> <span class="tl-hint" data-en="· for example all expenses from a month">· fx alle udgifter fra en måned</span></span>
      <textarea id="mb-list" class="tl-textarea" rows="5" placeholder="249,00&#10;1.150,50&#10;89"></textarea>
    </label>
    <p class="tl-note" id="mb-list-note"></p>
  </div>

  <div class="card tl-sticky" aria-live="polite">
    <div class="tl-hero">
      <p class="tl-hero-label" id="mb-hero-label"></p>
      <p class="tl-hero-value" id="mb-hero">–</p>
    </div>
    <dl class="tl-result">
      <div><dt data-en="Amount without VAT">Beløb uden moms</dt><dd><button type="button" class="tl-link-btn tl-copy" data-copy="ex" title="Kopier" data-en-title="Copy">–</button></dd></div>
      <div><dt data-en="VAT 25 %">Moms 25 %</dt><dd><button type="button" class="tl-link-btn tl-copy" data-copy="vat" title="Kopier" data-en-title="Copy">–</button></dd></div>
      <div class="tl-total"><dt data-en="Amount with VAT">Beløb med moms</dt><dd><button type="button" class="tl-link-btn tl-copy" data-copy="inc" title="Kopier" data-en-title="Copy">–</button></dd></div>
    </dl>
    <p class="tl-error" id="mb-error" hidden></p>
    <div id="mb-list-result" hidden>
      <p class="tl-card-title" style="margin-top:24px" id="mb-list-title"></p>
      <dl class="tl-result">
        <div><dt data-en="Without VAT">Uden moms</dt><dd id="mb-l-ex">–</dd></div>
        <div><dt data-en="VAT">Moms</dt><dd id="mb-l-vat">–</dd></div>
        <div class="tl-total"><dt data-en="With VAT">Med moms</dt><dd id="mb-l-inc">–</dd></div>
      </dl>
      <p class="tl-error" id="mb-l-error" hidden></p>
    </div>
    <p class="tl-note" data-en="Click an amount to copy it. The VAT on an amount without VAT is 25 %; the VAT inside an amount with VAT is 20 % of it.">Klik på et beløb for at kopiere det. Moms af et beløb uden moms er 25 %; momsen i et beløb med moms er 20 % af beløbet.</p>
  </div>
</div>
