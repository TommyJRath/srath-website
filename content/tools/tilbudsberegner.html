<div class="tl-grid">
  <div class="card">
    <p class="tl-card-title" data-en="Your work">Dit arbejde</p>
    <div class="tl-fields tl-fields-2">
      <label class="tl-field"><span data-en="Task">Opgave</span><input class="tl-input" id="tb-task" placeholder="Ny hjemmeside" data-en-placeholder="New website"></label>
      <label class="tl-field"><span data-en="Estimated hours">Anslåede timer</span><input class="tl-input" id="tb-hours" inputmode="decimal" value="20"></label>
      <label class="tl-field"><span><span data-en="Hourly rate">Timepris</span> <span class="tl-hint" data-en-html="· without VAT · &lt;a href=&quot;/tools/timeprisberegner/?lang=en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;work it out&lt;/a&gt;">· uden moms · <a href="/tools/timeprisberegner/" target="_blank" rel="noopener">regn den ud</a></span></span><span class="tl-affix" data-suffix="kr."><input class="tl-input" id="tb-rate" inputmode="decimal" value="650"></span></label>
      <label class="tl-field"><span><span data-en="Buffer for the unexpected">Buffer til det uforudsete</span> <span class="tl-hint" data-en="· added to the hours">· lægges på timerne</span></span><span class="tl-affix" data-suffix="%"><input class="tl-input" id="tb-buffer" inputmode="decimal" value="15"></span></label>
    </div>

    <p class="tl-card-title" style="margin-top:28px"><span data-en="Materials and purchases">Materialer og indkøb</span> <span class="tl-hint" style="text-transform:none;letter-spacing:0" data-en="· your cost without VAT">· din kostpris uden moms</span></p>
    <div class="tl-rows">
      <div class="tl-row tb-line tl-row-head" aria-hidden="true"><span data-en="Item">Vare</span><span class="tl-num" data-en="Qty">Antal</span><span class="tl-num" data-en="Cost each">Kostpris</span><span></span></div>
      <div id="tb-lines" class="tl-rows"></div>
    </div>
    <div class="tl-actions" style="margin-top:10px"><button type="button" class="btn btn-ghost tl-btn-sm" id="tb-add" data-en="+ Add item">+ Tilføj vare</button></div>
    <div class="tl-fields tl-fields-2" style="margin-top:14px">
      <label class="tl-field"><span data-en="Markup on materials">Avance på materialer</span><span class="tl-affix" data-suffix="%"><input class="tl-input" id="tb-markup" inputmode="decimal" value="20"></span></label>
      <label class="tl-field"><span data-en="Discount">Rabat</span><span class="tl-affix" data-suffix="%"><input class="tl-input" id="tb-discount" inputmode="decimal" value="0"></span></label>
    </div>
  </div>

  <div class="card tl-sticky" aria-live="polite">
    <div class="tl-hero">
      <p class="tl-hero-label" data-en="Price for the customer">Pris til kunden</p>
      <p class="tl-hero-value" id="tb-total">–</p>
      <p class="tl-hero-sub" id="tb-total-inc">–</p>
    </div>
    <dl class="tl-result" id="tb-result"></dl>
    <p class="tl-error" id="tb-error" hidden></p>
    <div class="tl-actions">
      <button type="button" class="btn btn-primary" id="tb-send" data-en="Make a quote from this">Lav et tilbud ud fra det</button>
    </div>
    <p class="tl-note" data-en="Opens the quote in the invoice generator with the work and each item as lines, and any discount as its own line, so the customer sees it. Nothing you type here is saved.">Åbner tilbuddet i fakturageneratoren med arbejdet og hver vare som linjer og en eventuel rabat som sin egen linje, så kunden kan se den. Intet af det du skriver her bliver gemt.</p>
  </div>
</div>
